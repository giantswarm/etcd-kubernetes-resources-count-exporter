{{- if .Values.kyvernoPolicyExceptions.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ tpl .Values.resource.default.name . }}-policy-exceptions
  namespace: {{ .Values.kyvernoPolicyExceptions.namespace | default "giantswarm" }}
  labels:
    {{- include "etcd-kubernetes-resources-count-exporter.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  policyRefs:
  - name: require-run-as-non-root-user
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: disallow-host-namespaces
    kind: ValidatingPolicy
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: disallow-host-ports
    kind: ValidatingPolicy
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  - name: restrict-volume-types
    kind: ValidatingPolicy
  - name: restrict-sysctls
    kind: ValidatingPolicy
  # require-non-root-groups is missing from the legacy exception. It is excepted
  # because the etcd-kubernetes-resources-count-exporter Deployment fails it.
  - name: require-non-root-groups
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the etcd-kubernetes-resources-count-exporter
  # ServiceAccount fails it when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: etcd-kubernetes-resources-count-exporter-workloads
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['Deployment', 'ReplicaSet', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ tpl .Values.resource.default.namespace . }}' &&
      has(object.metadata.name) &&
      (object.metadata.name == '{{ tpl .Values.resource.default.name . }}' || object.metadata.name.startsWith('{{ tpl .Values.resource.default.name . }}-'))
{{- end }}
